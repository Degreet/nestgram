name: Bot API spec drift

# Polls the vendored Telegram Bot API spec daily and opens a PR when a NEW Bot
# API version lands. Daily — not more often — because the upstream source
# (PaulSonOfLars) re-scrapes the docs once a day, so a finer cadence cannot
# lower latency. Releases follow no fixed weekday or date, so daily is the only
# way to catch one within ~24h.
#
# The gate is the `botApiVersion` STRING, not raw output drift: Telegram's prose
# is embedded in our generated JSDoc, so the emitted files churn on cosmetic doc
# edits the upstream re-scrape picks up. Gating on the version keeps daily polling
# noise-free — prose tweaks fold into the next real version bump.
#
# Runs only where the `SPEC_DRIFT` repo variable is set to `true` (the
# development repo). Elsewhere — e.g. a public mirror — the job is inert, and the
# workflow file names no repository.

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# A manual dispatch and the daily cron must not race on the shared spec/bot-api-bump
# branch and PR. Serialize them; let an in-flight run finish rather than cancel it.
concurrency:
  group: spec-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Bump vendored spec on a new Bot API release
    if: vars.SPEC_DRIFT == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update vendored spec & detect a new version
        id: check
        shell: bash
        run: |
          before=$(node -p "require('./tools/codegen/spec/spec-version.json').botApiVersion")
          npm run spec:update
          after=$(node -p "require('./tools/codegen/spec/spec-version.json').botApiVersion")

          # `node -p` prints `undefined` and exits 0 for a missing key, so a
          # renamed or corrupted `botApiVersion` would leave before == after ==
          # "undefined" — a green run, forever, that silently stops detecting
          # drift at all. Refuse the value instead of comparing it. The shape
          # check also keeps an upstream-controlled string out of $GITHUB_OUTPUT,
          # where embedded newlines could forge additional step outputs.
          case "$after" in
            '' | undefined | null)
              echo "::error::botApiVersion is '$after' — the vendored spec is missing or malformed."
              exit 1
              ;;
            *[!A-Za-z0-9.\ _-]*)
              echo "::error::botApiVersion has an unexpected shape: $after"
              exit 1
              ;;
          esac

          echo "version=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Still on $after — no new Bot API release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New Bot API release: $before -> $after"
          fi

      # Regeneration and verification are ONE step on purpose. They used to be
      # two, and the escalation below keyed off the second — so when `generate`
      # itself crashed on a new IR shape (the likeliest failure, and what 10.2
      # did), the job aborted, the gate never ran, and `gate.outcome` came back
      # `skipped` rather than `failure`. The issue was never filed and the only
      # signal was a bare red cron. One step, one outcome, no hole to fall through.
      # `timeout-minutes` on the STEP, not the job: a step killed by its own
      # timeout is marked failed, so `failure()` still fires and files an issue.
      # A job-level timeout cancels instead, and a cancelled run escalates
      # nothing — the same silent hole in a different shape.
      # Still ONE step, and `stage` is recorded INSIDE it rather than by splitting
      # it up: outputs written before a failing exit survive, so the diagnosis is
      # captured without reintroducing the `skipped`-outcome hole. `|| fail …`
      # rather than bare commands because the shell runs with `-e`, which would
      # abort before anything could be recorded.
      - name: Regenerate and gate (lint, build, test, hand-owned drift)
        id: gate
        if: steps.check.outputs.changed == 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          fail() {
            echo "stage=$1" >> "$GITHUB_OUTPUT"
            echo "::error::spec-drift gate failed at: $1"
            exit 1
          }

          # First, and never gated: the seam report reads only the spec JSON, so
          # it is the one artifact that survives a codegen crash — which is
          # exactly the run where a human most needs it.
          # `--silent`: npm's own `> pkg@ver script` banner goes to stdout and
          # would otherwise be the first two lines of every PR body.
          npm run --silent spec:diff > "$RUNNER_TEMP/spec-diff.md" \
            || fail 'spec:diff (the vendored spec is unreadable)'

          npm run generate \
            || fail 'generate (codegen crashed — a new IR shape, or a seam the manifest must be taught)'
          npm run lint  || fail 'lint'
          npm run build || fail 'build (regenerated types broke hand-owned code)'
          npm test      || fail 'test'
          npm run generate -- --check \
            || fail 'generate --check (self-test invariant, hand-owned drift, or stale output)'

      # Opened whether or not the gate passed — DRAFT when it failed. A failed
      # gate used to produce nothing at all: no branch, no diff, just an issue
      # telling a maintainer to redo every mechanical step locally. The bump and
      # whatever regenerated cleanly are worth having either way; `draft` is what
      # says "not ready", and the seam report below says what is left to do.
      - name: Open the spec-bump PR
        id: pr
        if: always() && steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: spec/bot-api-bump
          draft: ${{ steps.gate.outcome != 'success' }}
          commit-message: 'chore(spec): ${{ steps.check.outputs.version }}'
          title: 'chore(spec): ${{ steps.check.outputs.version }}'
          body: |
            Automated vendored-spec bump to **${{ steps.check.outputs.version }}**.

            Gate (`generate` / lint / build / test / `generate --check`):
            **${{ steps.gate.outcome }}**${{ steps.gate.outputs.stage && format(' — failed at `{0}`', steps.gate.outputs.stage) }}.

            A draft means the gate failed and this branch is a starting point, not
            a finished bump: the regenerated output may be partial. The seam
            report follows in a moment.
          labels: |
            spec
            automated

      # The report is attached by API, never interpolated through the shell: its
      # text is built from upstream-controlled type and field names, and
      # `$GITHUB_OUTPUT` is delimiter-injectable. `readFileSync` has no such seam.
      - name: Attach the seam report to the PR
        if: always() && steps.pr.outputs.pull-request-number
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const BODY_LIMIT = 60000; // GitHub caps a PR body at 65536.

            let report;
            try {
              report = readFileSync(`${process.env.RUNNER_TEMP}/spec-diff.md`, 'utf8');
            } catch {
              core.warning('No seam report was produced; leaving the PR body as opened.');
              return;
            }
            if (report.length > BODY_LIMIT) {
              report = `${report.slice(0, BODY_LIMIT)}\n\n_(truncated — run \`npm run spec:diff\` locally for the rest)_`;
            }

            const pull_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number,
            });
            await github.rest.pulls.update({
              ...context.repo,
              pull_number,
              body: `${pr.body}\n\n---\n\n${report}`,
            });
            core.notice(`Attached the seam report to #${pull_number}.`);

      # Guarded on `failure()`, not on the gate's outcome: anything that fails
      # earlier — `npm ci`, or `spec:update` hitting a network error on an
      # unattended cron — used to escalate nothing at all, leaving the same bare
      # red run this workflow exists to explain. `failure()` is true when ANY
      # prior step failed, so a step added later is covered too.
      - name: Report the failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SPEC_VERSION: ${{ steps.check.outputs.version }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_STAGE: ${{ steps.gate.outputs.stage }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const SEAM_LABEL = 'manual-seam';
            const version = process.env.SPEC_VERSION;
            const runUrl = process.env.RUN_URL;
            const stage = process.env.GATE_STAGE;
            const prUrl = process.env.PR_URL;

            // Diagnose from the gate's own outcome, never from "a version is
            // known". `failure()` deliberately catches steps on either side of
            // the gate, so inferring gate-failure from a non-empty version would
            // confidently blame the codegen manifest for, say, a PR-open error.
            const diagnosis =
              process.env.GATE_OUTCOME === 'failure'
                ? {
                    title: `${version}: codegen gate failed — manual seam needed`,
                    summary:
                      `The vendored spec bumped to **${version}**, but the codegen gate ` +
                      `failed at \`${stage || 'an unrecorded stage'}\`.`,
                    next: prUrl
                      ? `A DRAFT PR carries the bump and whatever regenerated cleanly: ${prUrl}\nIts body holds the seam report — what changed upstream, and which seams that lands on. Fix the seam on that branch and mark it ready.`
                      : 'No draft PR was opened. Run `npm run spec:update && npm run spec:diff` locally, fix the seam in `tools/codegen/manifest.ts`, and open the bump PR by hand.',
                  }
                : version
                  ? {
                      title: `${version}: spec bump verified, but the run failed`,
                      summary:
                        `The spec bumped to **${version}** and the codegen gate PASSED — the ` +
                        'regenerated surface is sound. The run failed elsewhere, most likely ' +
                        'opening the PR. This is not a codegen seam.',
                      next: prUrl
                        ? `The PR did open: ${prUrl}. Check the run log for what failed after it.`
                        : 'Check the run log, then re-run the workflow or open the bump PR by hand.',
                    }
                  : {
                      title: 'spec-drift: the daily run failed before version detection',
                      summary:
                        'The daily spec-drift run failed before it could determine the Bot API ' +
                        'version — usually a network or install failure, not a codegen seam.',
                      next: 'Check the run log. If this was a one-off flake, close this issue.',
                    };

            // The cron re-detects the same bump every day until the fix lands on
            // main (each run starts from a fresh checkout, so the committed spec
            // version stays behind). Track one issue per version rather than one
            // per day — matching on the version prefix, not the whole title, so a
            // maintainer renaming the issue doesn't silently start a duplicate.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: SEAM_LABEL,
              per_page: 100,
            });
            const tracked = open.find((issue) =>
              version
                ? issue.title.startsWith(`${version}:`)
                : issue.title === diagnosis.title,
            );

            const body = [
              diagnosis.summary,
              '',
              `Failing run: ${runUrl}`,
              '',
              diagnosis.next,
            ].join('\n');

            // Already tracked: refresh the issue body IN PLACE and post nothing.
            //
            // A daily "still failing" comment is pure noise — the maintainer
            // already gets the red cron by mail, and a month of them buries the
            // one comment that might matter. Editing the body notifies nobody,
            // so the issue stays quiet while still carrying a run link that
            // works: the first run's logs expire long before a stale bump lands.
            //
            // Only the marked block is rewritten, so notes a maintainer adds to
            // the body survive.
            if (tracked) {
              const START = '<!-- latest-run -->';
              const END = '<!-- /latest-run -->';
              const days = Math.max(
                1,
                Math.round(
                  (Date.now() - Date.parse(tracked.created_at)) / 86400000,
                ),
              );
              const block = [
                START,
                `_Still failing as of ${new Date().toISOString().slice(0, 10)}` +
                  ` (day ${days}). Latest run: ${runUrl}_`,
                END,
              ].join('\n');

              const body = tracked.body ?? '';
              const from = body.indexOf(START);
              const to = body.indexOf(END);
              const next =
                from !== -1 && to > from
                  ? body.slice(0, from) + block + body.slice(to + END.length)
                  : `${body}\n\n${block}`;

              if (next !== body) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracked.number,
                  body: next,
                });
              }
              core.info(
                `Already tracked by #${tracked.number}; refreshed its run link silently.`,
              );
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: diagnosis.title,
              body: [
                body,
                '',
                'While this issue is open, later failures for the same version comment here',
                'instead of filing again. The daily run stays red until the bump lands on',
                '`main` — that red is the reminder, not a separate fault. Closing this without',
                'landing the bump means tomorrow files a fresh one.',
              ].join('\n'),
              labels: ['spec', SEAM_LABEL],
            });
            core.notice(`Filed #${issue.data.number}: ${diagnosis.title}`);
